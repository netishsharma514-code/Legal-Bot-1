<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f6f1" />
    <title>Page not found | Legal Bot</title>
    <link rel="icon" type="image/svg+xml" href="/Legal-Bot-1/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202a25;
        background: #f7f6f1;
      }

      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: 1.25rem;
        place-items: center;
      }
      main {
        width: min(100%, 38rem);
        padding: clamp(1.5rem, 6vw, 3.25rem);
        border: 1px solid #e1dfd5;
        border-radius: 1rem;
        background: #fbfaf7;
      }
      .mark {
        display: grid;
        width: 3.25rem;
        height: 3.25rem;
        place-items: center;
        border: 1px solid #d7ded5;
        border-radius: 50%;
        background: #edf1eb;
        color: #315e48;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.6rem;
      }
      .eyebrow {
        margin: 1.6rem 0 0;
        color: #52715e;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      h1 {
        margin: 0.55rem 0 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 8vw, 2.8rem);
        font-weight: 400;
        letter-spacing: -0.035em;
        line-height: 1.12;
      }
      p {
        color: #68736b;
        font-size: 0.95rem;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        margin-top: 0.75rem;
        padding: 0.65rem 0.9rem;
        border: 1px solid #315e48;
        border-radius: 0.5rem;
        background: #315e48;
        color: #fff;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background: #244737; }
      .helplines {
        margin-top: 1.7rem;
        padding: 0.85rem 1rem;
        border: 1px solid #e8d9c5;
        border-radius: 0.55rem;
        background: #f7f1e7;
        color: #625441;
        font-size: 0.8rem;
      }
      .helplines a {
        display: inline;
        min-height: 0;
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        color: #625441;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">§</div>
      <p class="eyebrow">PAGE NOT FOUND · 404</p>
      <h1>This page isn’t in the record.</h1>
      <p>
        The address may be out of date, or the page may have moved. Return to
        Legal Bot to find the information you need.
      </p>
      <a href="/Legal-Bot-1/#home">Return to Legal Bot</a>
      <div class="helplines">
        Urgent help: <a href="tel:112">112</a> for emergencies or
        <a href="tel:1930">1930</a> to report cyber fraud.
      </div>
    </main>
  </body>
</html>
