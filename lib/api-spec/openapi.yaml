openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: legal
    description: Legal Bot AI and document analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Required service configuration is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /chat:
    post:
      operationId: sendLegalChatMessage
      tags: [legal]
      summary: Generate a legal-awareness response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalChatInput"
      responses:
        "200":
          description: Generated answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalChatReply"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI unavailable; use the statutory fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /extract-document-text:
    post:
      operationId: extractLegalDocumentText
      tags: [legal]
      summary: Extract selectable text from a supported legal document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentExtractionInput"
      responses:
        "200":
          description: Extracted document text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentExtractionResult"
        "400":
          description: Invalid request or unsupported format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: File exceeds the supported size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Document is unreadable or has no selectable text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /analyze-document:
    post:
      operationId: analyzeLegalDocument
      tags: [legal]
      summary: Analyze a legal document and identify potential risks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAnalysisInput"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAnalysisEnvelope"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /consultation-inquiries:
    post:
      operationId: submitConsultationInquiry
      tags: [legal]
      summary: Store a consented consultation inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationInquirySubmission"
      responses:
        "201":
          description: Inquiry stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAccepted"
        "400":
          description: Invalid form data or missing consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Supabase storage failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Supabase is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /lawyer-applications:
    post:
      operationId: submitLawyerApplication
      tags: [legal]
      summary: Store an advocate application for manual review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LawyerApplicationSubmission"
      responses:
        "201":
          description: Application stored for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAccepted"
        "400":
          description: Invalid application data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Supabase storage failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Supabase is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
        fallback:
          type: boolean
        isScannedOrUnreadable:
          type: boolean
      required: [error]
    SubmissionAccepted:
      type: object
      properties:
        success:
          type: boolean
          const: true
      required: [success]
    ConsultationInquiry:
      type: object
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        lawyerId: { type: string, minLength: 1, maxLength: 120 }
        lawyerName: { type: string, minLength: 1, maxLength: 200 }
        lawyerBarCouncil: { type: string, minLength: 1, maxLength: 120 }
        lawyerCourt: { type: string, minLength: 1, maxLength: 200 }
        lawyerCity: { type: string, minLength: 1, maxLength: 120 }
        documentName: { type: string, minLength: 1, maxLength: 255 }
        documentType: { type: string, minLength: 1, maxLength: 120 }
        documentSummary: { type: string, maxLength: 6000 }
        extractedIssues:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 1000 }
        userName: { type: string, minLength: 1, maxLength: 200 }
        userPhone: { type: string, minLength: 1, maxLength: 40 }
        userEmail: { type: string, format: email, maxLength: 254 }
        userLocation: { type: string, minLength: 1, maxLength: 160 }
        userNote: { type: string, maxLength: 4000 }
        consentGiven: { type: boolean, const: true }
        status:
          type: string
          enum: [Pending Advocate Review]
        createdAt: { type: string, format: date-time }
      required:
        - id
        - lawyerId
        - lawyerName
        - lawyerBarCouncil
        - lawyerCourt
        - lawyerCity
        - documentName
        - documentType
        - documentSummary
        - extractedIssues
        - userName
        - userPhone
        - userEmail
        - userLocation
        - consentGiven
        - status
        - createdAt
    ConsultationInquirySubmission:
      type: object
      properties:
        inquiry:
          $ref: "#/components/schemas/ConsultationInquiry"
        mode:
          type: string
          enum: [chamber, phone, video]
      required: [inquiry]
    LawyerApplicationSubmission:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        barCouncilNumber: { type: string, minLength: 1, maxLength: 120 }
        state: { type: string, minLength: 1, maxLength: 120 }
        city: { type: string, minLength: 1, maxLength: 120 }
        court: { type: string, minLength: 1, maxLength: 200 }
        experienceYears: { type: integer, minimum: 0, maximum: 70 }
        specializations:
          type: array
          minItems: 1
          maxItems: 15
          items: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: string, minLength: 1, maxLength: 40 }
        email: { type: string, format: email, maxLength: 254 }
        feeEstimate: { type: string, maxLength: 200 }
        bio: { type: string, maxLength: 4000 }
      required:
        - name
        - barCouncilNumber
        - state
        - city
        - court
        - experienceYears
        - specializations
        - phone
        - email
        - feeEstimate
        - bio
    LegalSection:
      type: object
      properties:
        id: { type: string }
        act: { type: string }
        number: { type: string }
        title: { type: string }
        penalty: { type: string }
        bailable: { type: boolean }
        cognizable: { type: boolean }
      required: [id, act, number, title]
    LegalChatTurn:
      type: object
      properties:
        sender:
          type: string
          enum: [user, assistant]
        text:
          type: string
          maxLength: 20000
      required: [sender, text]
    LegalChatInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 10000
        matchedSections:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/LegalSection"
        history:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/LegalChatTurn"
      required: [message]
    LegalChatReply:
      type: object
      properties:
        reply: { type: string }
        source:
          type: string
          enum: [gemini-2.5-flash, statutory-engine]
      required: [reply, source]
    DocumentExtractionInput:
      type: object
      properties:
        base64:
          type: string
          maxLength: 14000000
        filename:
          type: string
          maxLength: 255
        mimeType:
          type: string
          maxLength: 255
      required: [base64, filename]
    DocumentExtractionResult:
      type: object
      properties:
        success: { type: boolean }
        filename: { type: string }
        text: { type: string }
        characterCount: { type: integer }
        estimatedWords: { type: integer }
      required: [success, filename, text, characterCount, estimatedWords]
    DocumentAnalysisInput:
      type: object
      properties:
        documentText:
          type: string
          minLength: 1
          maxLength: 10000000
        documentName:
          type: string
          maxLength: 255
      required: [documentText]
    ExtractedParty:
      type: object
      properties:
        role: { type: string }
        name: { type: string }
      required: [role, name]
    ExtractedDate:
      type: object
      properties:
        label: { type: string }
        dateOrPeriod: { type: string }
      required: [label, dateOrPeriod]
    ExtractedClause:
      type: object
      properties:
        clauseTitle: { type: string }
        originalTextSnippet: { type: string }
        purpose: { type: string }
      required: [clauseTitle, originalTextSnippet, purpose]
    ExtractedFacts:
      type: object
      properties:
        documentType: { type: string }
        subject: { type: string }
        parties:
          type: array
          items: { $ref: "#/components/schemas/ExtractedParty" }
        importantDates:
          type: array
          items: { $ref: "#/components/schemas/ExtractedDate" }
        keyObligations:
          type: array
          items: { type: string }
        importantClauses:
          type: array
          items: { $ref: "#/components/schemas/ExtractedClause" }
      required: [documentType, subject, parties, importantDates, keyObligations, importantClauses]
    FlaggedClause:
      type: object
      properties:
        clauseTitle: { type: string }
        severity:
          type: string
          enum: [Low, Medium, High]
        issue: { type: string }
        recommendation: { type: string }
        relevantLaw: { type: string }
        evidenceSnippet:
          type: string
          maxLength: 600
      required: [clauseTitle, issue, recommendation, evidenceSnippet]
    OfficialSource:
      type: object
      properties:
        title: { type: string }
        statute: { type: string }
        url: { type: string }
        relevance: { type: string }
      required: [title, statute, url, relevance]
    DocumentAnalysis:
      type: object
      properties:
        summary: { type: string }
        plainLanguageExplanation: { type: string }
        documentType: { type: string }
        subject: { type: string }
        riskScore: { type: number, minimum: 0, maximum: 100 }
        riskLevel:
          type: string
          enum: [Low, Medium, High]
        governingLawCompliance: { type: string }
        extractedFacts:
          $ref: "#/components/schemas/ExtractedFacts"
        flaggedClauses:
          type: array
          items: { $ref: "#/components/schemas/FlaggedClause" }
        missingProtections:
          type: array
          items: { type: string }
        positiveAspects:
          type: array
          items: { type: string }
        recommendedNextSteps:
          type: array
          items: { type: string }
        officialSources:
          type: array
          items: { $ref: "#/components/schemas/OfficialSource" }
      required:
        - summary
        - plainLanguageExplanation
        - documentType
        - subject
        - extractedFacts
        - flaggedClauses
        - recommendedNextSteps
        - officialSources
    DocumentAnalysisEnvelope:
      type: object
      properties:
        analysis:
          $ref: "#/components/schemas/DocumentAnalysis"
        source:
          type: string
          enum: [gemini-2.5-flash, statutory-engine]
        notice: { type: string }
      required: [analysis, source]
